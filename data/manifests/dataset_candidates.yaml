  estimated_tokens: "about 15M tokens, rough range 12M-19M"
  language_strategy: "English only for Nexa V1"
  proposed_mix:
    standard_ebooks: "45%"
    project_gutenberg: "25%"
    simple_english_wikipedia: "20%"
    bccampus_cc_by_verified_textbooks: "10%"
rejected_or_deferred:
