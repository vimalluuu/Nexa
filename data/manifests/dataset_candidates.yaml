    reason: "Current official access requires no-LLM-training affirmation; attribution and code-license complexity"
  - dataset_name: "The Pile"
    reason: "Too large and mixed/uncertain licensing"
  - dataset_name: "C4/Common Crawl-derived corpora"
    reason: "Underlying web content licensing is unclear for Nexa's license-safety goal"
  - dataset_name: "BookCorpus"
    reason: "Copyright/license provenance unclear"
  - dataset_name: "OpenWebText"
    reason: "Underlying linked web pages do not provide sufficiently clear licensing"
