recommendation:
  primary_dataset:
    id: "wikimedia_wikipedia_english"
    pinned_version: "20231101.en or an equivalently pinned official dump version"
    rationale: "Best combined license/provenance/reproducibility fit under the present strict gate; selected subset only."
  optional_secondary_datasets:
    - id: "pg19"
      maximum_share_percent: 20
      rationale: "Adds long-form prose without manual book collection; require per-source/jurisdiction review."
    - id: "pmc_oa_commercial_reuse"
      status: "deferred"
      rationale: "Potential later scientific supplement only after article-level CC0/CC-BY manifesting."
  conditionally_deferred_alternative:
    id: "fineweb"
    condition: "Only after explicit policy/legal acceptance of Common Crawl Terms of Use, source-rights uncertainty, and web synthetic-content risk."
  initial_token_budget:
    target_tokens: 10000000
    rationale:
      - "CPU-only PyTorch and no CUDA-capable training GPU"
      - "Validate end-to-end data and training behavior before a 50M-token commitment"
      - "Storage is not the bottleneck; measured training throughput is"
    proposed_mix:
      - source: "wikimedia_wikipedia_english"
        target_tokens: 8000000
        share_percent: 80
      - source: "pg19"
