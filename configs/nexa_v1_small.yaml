# =============================================================================
# Nexa V1 — Config A: Small (CPU-Safe)
# =============================================================================
# Designed for: safe, fast iteration on the 20.9M-token pilot corpus
# CPU:          AMD Ryzen 5 5600G  (6 cores / 12 threads, no CUDA)
# RAM budget:   <= 2 GB total (model + optimizer + activations)
#
# Parameter breakdown:
#   vocab_size=2048, d_model=128, n_heads=4, n_layers=4, d_ff=512
#   Embedding:   2048 × 128          = 262,144  (tied w/ LM head → not doubled)
#   Attn/layer:  4 × 128 × 128       =  65,536
#   FFN/layer:   3 × 128 × 512       = 196,608  (SwiGLU: gate+up+down)
#   Norm/layer:  2 × 128             =     256  (negligible)
#   4 layers:    4 × (65536+196608)  = 1,048,576
#   Final norm:  128                 =     128
#   Total:       262,144 + 1,048,576 ≈ 1.31M parameters
#
# Memory estimate (float32, no grad):
#   Model weights:   1.31M × 4B = ~5.2 MB
#   Optimizer (AdamW 2 states): ~10.5 MB
#   Activations (B=4, S=256):  <<1 MB
#   Total: << 50 MB — very comfortable
#
# Expected throughput (CPU, B=4, S=256): ~2,000-5,000 tokens/sec
# =============================================================================

model:
  name: "nexa-v1-small"
  version: "1.0.0"

  vocab_size: 2048
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2

  max_seq_len: 256

  d_model: 128
  n_heads: 4
  n_layers: 4
  d_ff: 512

  dropout: 0.1
  norm_type: "rmsnorm"
  norm_eps: 1.0e-6
  pos_encoding: "rotary"
  tie_embeddings: true
